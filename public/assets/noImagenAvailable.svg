<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f3f4f6"/>
  
  <!-- Icon container -->
  <g transform="translate(200, 200)">
    <!-- Image icon -->
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#d1d5db" stroke="#9ca3af" stroke-width="3"/>
    
    <!-- Mountain/landscape shape -->
    <path d="M -60,-20 L -30,-50 L 0,-20 L 30,-40 L 60,-10 L 60,40 L -60,40 Z" fill="#9ca3af"/>
    
    <!-- Sun/circle -->
    <circle cx="-40" cy="-35" r="12" fill="#fbbf24"/>
    
    <!-- Slash line (no image indicator) -->
    <line x1="-90" y1="-70" x2="90" y2="70" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="600">
    Imagen no disponible
  </text>
</svg>
